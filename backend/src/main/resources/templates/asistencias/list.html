<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Control de Asistencias')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h1 class="h3 fw-bold text-dark mb-0">Control Diario de Asistencias</h1>
            <p class="text-secondary small mb-0">Registro y monitoreo de flujo de entrada de socios</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <a th:href="@{/reportes/exportar/asistencias.csv}" class="btn btn-outline-success fw-bold shadow-sm">
                <i class="bi bi-file-earmark-excel me-1"></i> Excel / CSV
            </a>
            <a th:href="@{/asistencias/control-acceso}" class="btn btn-danger fw-bold shadow-sm">
                <i class="bi bi-upc-scan me-1"></i> Modo Check-in Rápido / Molinete
            </a>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Registro Rápido por Selección -->
    <div class="card shadow-sm border-0 mb-4" style="border-radius: 12px;">
        <div class="card-body p-3">
            <form th:action="@{/asistencias/registrar}" method="post" class="row g-2 align-items-center">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="col-md-8">
                    <label class="form-label small fw-bold text-dark mb-1">Registrar Entrada Manual:</label>
                    <select name="clienteId" class="form-select" required>
                        <option value="">-- Seleccione un cliente para registrar asistencia --</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombreCompleto + ' (DNI: ' + c.dni + ')'}"></option>
                    </select>
                </div>
                <div class="col-md-4 pt-md-4">
                    <button type="submit" class="btn btn-dark w-100 fw-bold">
                        <i class="bi bi-box-arrow-in-down-right me-1"></i> Registrar Entrada
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Historial General de Asistencias -->
    <div class="card shadow-sm border-0" style="border-radius: 12px;">
        <div class="card-header bg-white py-3">
            <h2 class="h5 fw-bold text-dark mb-0">
                <i class="bi bi-list-check text-danger me-1"></i> Registro Histórico de Entradas
            </h2>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Cliente / Socio</th>
                        <th>DNI</th>
                        <th>Fecha y Hora Exacta</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a, iter : ${asistencias}">
                        <td class="text-muted fw-semibold" th:text="${iter.count}">1</td>
                        <td>
                            <strong class="text-dark" th:text="${a.cliente.nombreCompleto}">Juan Perez</strong>
                        </td>
                        <td th:text="${a.cliente.dni}">72345678</td>
                        <td class="fw-bold text-primary" th:text="${#temporals.format(a.fechaHora, 'dd/MM/yyyy HH:mm:ss')}">27/08/2026 10:30:15</td>
                        <td class="text-end">
                            <a th:href="@{/asistencias/eliminar/{id}(id=${a.id})}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Está seguro de eliminar este registro de asistencia?');" title="Eliminar">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(asistencias)}">
                        <td colspan="5" class="text-center text-muted py-4">No hay asistencias registradas en el sistema.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
