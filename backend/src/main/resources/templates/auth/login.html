<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - BRUTAL FITNESS</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
        }
        .login-header {
            background-color: #111827;
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            border-bottom: 3px solid #dc3545;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="login-card mx-auto">
        <div class="login-header text-white">
            <div class="mb-2 text-center">
                <img th:src="@{/img/logo.png}" alt="BRUTAL FITNESS" style="max-height: 65px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));">
            </div>
            <p class="text-warning small fw-bold mb-1" style="font-size: 0.72rem; letter-spacing: 0.8px;">
                TRANSFORMANDO CUERPO, ALMA Y MENTE
            </p>
            <p class="text-secondary small mb-0">
                <i class="bi bi-geo-alt-fill text-danger me-1"></i> Jirón José Santos Chocano - Jesús Nazareno
            </p>
        </div>

        <div class="p-4 p-sm-5">
            <h2 class="h5 fw-bold text-dark text-center mb-4">Acceso al Sistema</h2>

            <!-- Alertas -->
            <div class="alert alert-danger py-2 small d-flex align-items-center" th:if="${errorMsg}">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <span th:text="${errorMsg}"></span>
            </div>

            <div class="alert alert-success py-2 small d-flex align-items-center" th:if="${logoutMsg}">
                <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                <span th:text="${logoutMsg}"></span>
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label class="form-label fw-semibold text-dark small">Usuario o DNI</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person-fill"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="admin, recepcion o DNI" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-dark small">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold text-uppercase shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                </button>
            </form>

            <!-- Cuentas de Acceso Rápido para Prueba -->
            <div class="mt-4 pt-3 border-top">
                <div class="text-muted small fw-bold text-center mb-2">Credenciales de Acceso:</div>
                <div class="bg-light p-2 rounded small text-muted">
                    <div>👑 <strong>Admin:</strong> <code>admin</code> / <code>admin123</code></div>
                    <div>💼 <strong>Recepción:</strong> <code>recepcion</code> / <code>recepcion123</code></div>
                    <div>🏋️‍♂️ <strong>Entrenador:</strong> <code>entrenador</code> / <code>entrenador123</code></div>
                    <div>👤 <strong>Socio / Cliente:</strong> <code>72345678</code> / <code>cliente123</code></div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
